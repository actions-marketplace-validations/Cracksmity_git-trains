# Copy this file to .github/workflows/train.yml in your profile repository
# (the one named after your username).
name: GitHub train

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: Cracksmity/git-trains@3b431f93872507bc915be9f20e8b84ed104fdbe8 # v1.1.2
        with:
          train: auto # or: tram, metro-orange, metro-gray, metro-yellow, metro-white, bullet, or your JSON: .github/train.json
          # skyline: new-york # or osaka, or your skyline in JSON: .github/skyline.json (see docs/ai/skyline.md)
          mode: single # or: multi (3 tracks, one train per language)
          # language: es # the LED sign reads RACHA instead of STREAK
          # exclude-languages: HTML, Jupyter Notebook
          # cards: both # adds card-stats.svg and card-languages.svg (see the README)
          # year-in-review: true # adds year-in-review.svg: a poster of one year as a train journey
          # review-year: 2025 # which year; empty = this year so far (last year in January)

      - name: Save the SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || (git commit -m "chore: update train" && git push)
