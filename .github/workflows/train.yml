# Draws the author's own train every day with the Action in this repository and
# publishes the SVGs to the `output` branch, which the README shows. The branch
# is rewritten each time (one commit), so neither main nor it piles up history.
name: Live train

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: ["src/**", "config/**", "action.yml", ".github/workflows/train.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-train
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          output-dir: out
          cards: both
          calendar: true
      # Repo mode: the same Action, drawing this repository instead of its owner. It writes
      # train-repo*.svg and card-repo-*.svg next to the files above, and the README shows them.
      - name: Draw this repository too
        uses: ./
        with:
          repo: ${{ github.repository }}
          output-dir: out
          cards: stats, departures
          calendar: true
      - name: Publish to the output branch
        working-directory: out
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Live train for ${{ github.repository_owner }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
