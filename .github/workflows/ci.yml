name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - name: The example SVGs in docs/ are up to date
        run: |
          node scripts/docs.js
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "::error::docs/*.svg are out of date. Run 'npm run docs' and commit the result."
            exit 1
          fi
      - name: Relative links in the site and the docs resolve
        run: node tools/conductor/gates/links.js index.html preview benchmarks gallery community leaderboard docs/ai README.md README.es.md CONTRIBUTING.md
      - name: The AI guides' examples pass the validator
        run: node tools/conductor/gates/guide-json.js docs/ai/train.md docs/ai/skyline.md
      - name: The Action runs end to end on sample data
        run: node src/index.js --sample
      - name: Repo mode runs end to end on sample data
        run: node src/index.js --sample
        env:
          INPUT_REPO: octocat/signal-box
          INPUT_CARDS: stats, languages, departures
          INPUT_CALENDAR: "true"

  action:
    # The Action itself, as users run it, against the repository owner's activity.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          output-dir: out
          cards: both
          mode: multi
      - run: ls -l out

  action-repo:
    # Repo mode, as users run it: this repository, read with the workflow's own token.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          repo: ${{ github.repository }}
          output-dir: out
          cards: stats, languages, departures
          calendar: true
      - run: ls -l out
