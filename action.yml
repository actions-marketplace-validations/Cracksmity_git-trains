name: git-trains
description: A pixel-art train for your GitHub profile that grows, changes color and speeds up with your activity.
author: Cracksmity
branding:
  icon: navigation
  color: orange

inputs:
  github-token:
    description: Token to read your activity. Use a PAT to count private contributions.
    default: ${{ github.token }}
  user:
    description: GitHub user to draw. Defaults to the repository owner.
    default: ${{ github.repository_owner }}
  repo:
    description: "owner/name of a repository to draw instead of a user (the workflow's own is github.repository): the train grows with its commits of the last year, the languages are its own, the cards show its stars, forks, issues and contributors, and the departures board lists its latest releases. Files are named train-repo*.svg and card-repo-*.svg. When set, `user` is ignored."
    default: ""
  train:
    description: "auto (evolves with your cars), a model (tram, metro-orange, metro-gray, metro-yellow, metro-white, bullet) or the path to your own train in JSON (for example .github/train.json)."
    default: auto
  skyline:
    description: "City behind the train: city (procedural, unique to you), new-york, osaka or the path to your own skyline in JSON (for example .github/skyline.json)."
    default: city
  mode:
    description: "single (one train in your top language) or multi (3 tracks, one train per language)."
    default: single
  theme:
    description: "both (writes light, dark and automatic), light, dark or auto."
    default: both
  language:
    description: "Language of the texts: en or es. Changes the word on the LED sign (STREAK / RACHA) and the cards."
    default: en
  label:
    description: Word on the LED sign before the streak number. Defaults to the one for `language`.
    default: ""
  scale:
    description: Size of each pixel in the SVG (1 to 6).
    default: "2"
  output-dir:
    description: Folder the SVGs are written to.
    default: dist
  exclude-languages:
    description: "Comma-separated languages to leave out of the stripe and the cards, for example: HTML, Jupyter Notebook."
    default: ""
  seasons:
    description: "true dresses the scene for the season or holiday of the day it runs: snow in winter, blossom in spring, leaves in autumn, Día de Muertos, Christmas, Hacktoberfest and New Year. false keeps it plain."
    default: "true"
  hemisphere:
    description: "north or south: which hemisphere the seasons follow (spring in the south is September to November). Holidays keep their dates."
    default: north
  calendar:
    description: "true also writes train-calendar.svg (and -light/-dark with theme both): your contribution calendar with your train running through it."
    default: "false"
  year-in-review:
    description: "true also writes year-in-review.svg (and -light/-dark with theme both): a poster of one calendar year of your activity drawn as a train journey. Your numbers, a route map with a station per month, your train running it, your top languages. It takes the same colors and language as the cards and makes one extra API request."
    default: "false"
  review-year:
    description: "The year the poster shows, from 2008 to the current one. Empty means the current year so far, or the year that just ended in January."
    default: ""
  cards:
    description: "Profile cards to generate: none, stats, languages, departures or both (stats and languages). Accepts a list: stats, departures."
    default: none
  unlocks:
    description: "true adds a special car to the main train when you earn it (dining: 100-day streak, observation: 100+ stars, mail: 500+ PRs). Needs your profile numbers, so it makes one extra API request; false skips it."
    default: "true"
  rank:
    description: "Center of the stats card ring: letter (S, A+, B...) or github (the logo)."
    default: letter
  border:
    description: "Card border: true or false."
    default: "true"
  max-languages:
    description: Most languages shown on the languages card (1 to 10).
    default: "6"
  color-background:
    description: Card background color, hex without #.
    default: ""
  color-title:
    description: Card title color, hex without #.
    default: ""
  color-icon:
    description: Card icon color, hex without #.
    default: ""
  color-text:
    description: Card text color, hex without #.
    default: ""
  color-ring:
    description: Color of the stats card rank ring, hex without #.
    default: ""

  # Spanish names from before v1. They still work and win when set.
  usuario: { description: "Deprecated: use `user`.", deprecationMessage: "Use `user` instead." }
  tren: { description: "Deprecated: use `train`.", deprecationMessage: "Use `train` instead." }
  fondo: { description: "Deprecated: use `skyline`.", deprecationMessage: "Use `skyline` instead." }
  modo: { description: "Deprecated: use `mode`.", deprecationMessage: "Use `mode` instead." }
  tema: { description: "Deprecated: use `theme`.", deprecationMessage: "Use `theme` instead." }
  idioma: { description: "Deprecated: use `language`.", deprecationMessage: "Use `language` instead." }
  etiqueta: { description: "Deprecated: use `label`.", deprecationMessage: "Use `label` instead." }
  escala: { description: "Deprecated: use `scale`.", deprecationMessage: "Use `scale` instead." }
  salida: { description: "Deprecated: use `output-dir`.", deprecationMessage: "Use `output-dir` instead." }
  tarjetas: { description: "Deprecated: use `cards`.", deprecationMessage: "Use `cards` instead." }
  rango: { description: "Deprecated: use `rank`.", deprecationMessage: "Use `rank` instead." }
  borde: { description: "Deprecated: use `border`.", deprecationMessage: "Use `border` instead." }
  lenguajes-max: { description: "Deprecated: use `max-languages`.", deprecationMessage: "Use `max-languages` instead." }
  color-fondo: { description: "Deprecated: use `color-background`.", deprecationMessage: "Use `color-background` instead." }
  color-titulo: { description: "Deprecated: use `color-title`.", deprecationMessage: "Use `color-title` instead." }
  color-icono: { description: "Deprecated: use `color-icon`.", deprecationMessage: "Use `color-icon` instead." }
  color-texto: { description: "Deprecated: use `color-text`.", deprecationMessage: "Use `color-text` instead." }
  color-anillo: { description: "Deprecated: use `color-ring`.", deprecationMessage: "Use `color-ring` instead." }

outputs:
  files:
    description: Paths of the generated SVGs, comma-separated.
  cars:
    description: Number of cars on the main train.
  streak:
    description: Current streak in days.
  state:
    description: idle, slow, normal or fast, from yesterday's activity.
  model:
    description: Model of the main train.

runs:
  using: node24
  main: src/index.js
